name: Runner version

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily, off the :00 mark so the run does not land in the API rush minute.
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: runner-version-${{ github.ref }}
  cancel-in-progress: true

# The gate only reads the checkout and the public releases API.
permissions:
  contents: read

jobs:
  check:
    name: RUNNER_VERSION freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Gate decision unit tests
        run: python3 scripts/ci/runner_version_check_test.py

      - name: Check RUNNER_VERSION against the official deprecation window
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/check-runner-version.sh
