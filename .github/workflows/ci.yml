name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Fetch crates for the offline container suite
        run: cargo fetch --locked

      # ubuntu-24.04 restricts unprivileged user namespaces through AppArmor,
      # which kills the nested rootless daemon's rootlesskit with
      # "fork/exec /proc/self/exe: operation not permitted" even inside a
      # privileged container. The runner VM is ephemeral, so relaxing the
      # restriction is contained to this job.
      - name: Allow the nested rootless daemon to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run Docker integration tests against a rootless daemon
        run: |
          set -Eeuo pipefail

          DIND_IMAGE="docker@sha256:c876e00a0d81f592492fc80acd92b3ee13d2160e962b4d01676c52d9434e84b4"
          CLI_IMAGE="docker@sha256:9f36dfce2d1fd053d700a4eca00c358df79bf7d8cb69d4a9e8d9981af18834ea"
          NODE_IMAGE="node@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d"
          RUST_IMAGE="rust@sha256:3914072ca0c3b8aad871db9169a651ccfce30cf58303e5d6f2db16d1d8a7e58f"
          BUILDKIT_REFERENCE="moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8"

          DIND_NAME="chimera-ci-dind"
          RUNTIME_VOLUME="chimera-ci-runtime"
          TMP_VOLUME="chimera-ci-tmp"
          CARGO_VOLUME="chimera-ci-cargo"
          TARGET_VOLUME="chimera-ci-target"
          TOOLS="$PWD/.tmp/ci-docker-tools"

          docker pull "$DIND_IMAGE"
          docker pull "$CLI_IMAGE"
          docker pull "$NODE_IMAGE"
          docker pull "$RUST_IMAGE"
          docker pull "$BUILDKIT_REFERENCE"

          # Extract the pinned Linux docker CLI, Buildx plugin, and Node binary
          # that the in-container test suite resolves from PATH.
          mkdir -p "$TOOLS/bin" "$TOOLS/cli-plugins"
          docker create --name chimera-ci-cli-extract "$CLI_IMAGE"
          docker cp chimera-ci-cli-extract:/usr/local/bin/docker "$TOOLS/bin/docker"
          docker cp \
            chimera-ci-cli-extract:/usr/local/libexec/docker/cli-plugins/docker-buildx \
            "$TOOLS/cli-plugins/docker-buildx"
          docker rm chimera-ci-cli-extract
          docker create --name chimera-ci-node-extract "$NODE_IMAGE"
          docker cp chimera-ci-node-extract:/usr/local/bin/node "$TOOLS/bin/node"
          docker rm chimera-ci-node-extract

          for volume in "$RUNTIME_VOLUME" "$TMP_VOLUME" "$CARGO_VOLUME" "$TARGET_VOLUME"; do
            docker volume create "$volume"
          done
          docker run --rm --user root --entrypoint chown \
            -v "$RUNTIME_VOLUME":/run/user/1000 \
            -v "$TMP_VOLUME":/chimera-tmp \
            -v "$CARGO_VOLUME":/cargo \
            -v "$TARGET_VOLUME":/cargo-target \
            "$DIND_IMAGE" -R 1000:1000 /run/user/1000 /chimera-tmp /cargo /cargo-target

          # The nested daemon must report the rootless security marker the
          # per-job Docker config tests (C-10) fail closed on.
          docker run -d --privileged --name "$DIND_NAME" \
            -e DOCKER_TLS_CERTDIR= \
            -e XDG_RUNTIME_DIR=/run/user/1000 \
            -v "$RUNTIME_VOLUME":/run/user/1000 \
            -v "$TMP_VOLUME":/chimera-tmp \
            "$DIND_IMAGE"

          security_options=""
          for _ in $(seq 1 60); do
            if security_options="$(docker exec \
              -e DOCKER_HOST=unix:///run/user/1000/docker.sock \
              "$DIND_NAME" \
              docker info --format '{{json .SecurityOptions}}' 2>/dev/null)"
            then
              break
            fi
            sleep 1
          done
          printf '%s\n' "$security_options"
          case "$security_options" in
            *'"name=rootless"'*) ;;
            *)
              docker logs "$DIND_NAME"
              echo "rootless Docker preflight failed" >&2
              exit 1
              ;;
          esac

          # C-10 requires BuildKit as an already-local immutable image and
          # never lets Buildx download it; preload it into the nested daemon.
          docker save --output /tmp/chimera-buildkit.tar "$BUILDKIT_REFERENCE"
          docker cp /tmp/chimera-buildkit.tar "$DIND_NAME":/tmp/chimera-buildkit.tar
          docker exec --user root "$DIND_NAME" chown 1000:1000 /tmp/chimera-buildkit.tar
          docker exec \
            -e DOCKER_HOST=unix:///run/user/1000/docker.sock \
            "$DIND_NAME" docker load --input /tmp/chimera-buildkit.tar
          BUILDKIT_IMAGE_ID="$(docker exec \
            -e DOCKER_HOST=unix:///run/user/1000/docker.sock \
            "$DIND_NAME" docker image inspect --format '{{.Id}}' "$BUILDKIT_REFERENCE")"
          test -n "$BUILDKIT_IMAGE_ID"

          # The suite runs in the daemon's network namespace so the test
          # registry's 127.0.0.1 port publishing and BuildKit share one
          # loopback interface with the tests themselves.
          docker run --rm \
            --user 1000:1000 \
            --network "container:$DIND_NAME" \
            -v "$RUNTIME_VOLUME":/run/user/1000 \
            -v "$TMP_VOLUME":/chimera-tmp \
            -v "$CARGO_VOLUME":/cargo \
            -v "$TARGET_VOLUME":/cargo-target \
            -v "$HOME/.cargo/registry":/cargo/registry:ro \
            -v "$PWD":/work:ro \
            -w /work \
            -v "$TOOLS/bin/docker":/usr/local/bin/docker:ro \
            -v "$TOOLS/bin/node":/usr/local/bin/node:ro \
            -v "$TOOLS/cli-plugins/docker-buildx":/usr/local/libexec/docker/cli-plugins/docker-buildx:ro \
            -e HOME=/chimera-tmp/home \
            -e CARGO_HOME=/cargo \
            -e CARGO_NET_OFFLINE=true \
            -e CARGO_TARGET_DIR=/cargo-target \
            -e TMPDIR=/chimera-tmp \
            -e DOCKER_HOST=unix:///run/user/1000/docker.sock \
            -e XDG_RUNTIME_DIR=/run/user/1000 \
            -e CHIMERA_TEST_BUILDKIT_IMAGE_ID="$BUILDKIT_IMAGE_ID" \
            "$RUST_IMAGE" \
            cargo test --offline -- --ignored

      - name: Clean up CI Docker resources
        if: always()
        run: |
          docker rm -f chimera-ci-dind 2>/dev/null || true
          docker rm -f chimera-ci-cli-extract chimera-ci-node-extract 2>/dev/null || true
          docker volume rm \
            chimera-ci-runtime \
            chimera-ci-tmp \
            chimera-ci-cargo \
            chimera-ci-target 2>/dev/null || true
