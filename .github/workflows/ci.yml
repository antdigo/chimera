name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller target dirs make the host caches and the container build cheaper;
  # incremental artifacts never survive the cache round-trips anyway.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-build

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-build

      - name: Allow host-step private mount namespaces
        run: |
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run unit tests
        run: |
          mkdir -p "$RUNNER_TEMP/chimera-tests"
          TMPDIR="$RUNNER_TEMP/chimera-tests" cargo test --lib

  host-integ:
    name: Host integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shard-1
            suite-args: >-
              --test import_official_test --test expressions_test --test hashfiles_test
              --test matrix_test --test needs_test --test secrets_test
              --test step_names_test --test timeout_test
          - name: shard-2
            # job_docker_config_docker_test also carries 36 non-ignored tests
            # that run on the host like any other suite; the ignored ones are
            # re-run inside the container by the docker job-config shard.
            suite-args: >-
              --test job_docker_config_test --test job_docker_config_docker_test
              --test basics_test --test composite_test --test conditions_test
              --test job_logs_test --test runner_context_test
              --test workflow_commands_test --test working_directory_test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-build

      - name: Allow host-step private mount namespaces
        run: |
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run host integration suites
        run: |
          mkdir -p "$RUNNER_TEMP/chimera-tests"
          TMPDIR="$RUNNER_TEMP/chimera-tests" cargo test ${{ matrix.suite-args }}

  docker:
    name: Docker suite (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dfa-1
            suite-args: --test dockerfile_actions_test
            test-filters: >-
              dockerfile_action_builds_and_propagates_exit_code
              successfully_built_dockerfile_action_propagates_nonzero_exit_code
              subdirectory_dockerfile_uses_action_root_as_context
              dockerfile_specific_ignore_overrides_root_ignore
              context_symlink_escape_fails_before_action_container_starts
          - name: dfa-2
            suite-args: --test dockerfile_actions_test
            test-filters: >-
              synthetic_secrets_stay_out_of_context_and_logs
              changed_context_rebuilds_while_unchanged_context_hits_cache
              cancelled_build_does_not_start_action_and_same_key_retries
              timed_out_action_does_not_start_entrypoint_and_same_key_retries
          # --skip (rather than an explicit name list) keeps any NEW ignored
          # test in this file running here, so sharding cannot silently drop
          # coverage when the suite grows.
          - name: dfa-residual
            suite-args: --test dockerfile_actions_test
            test-filters: >-
              --skip dockerfile_action_builds_and_propagates_exit_code
              --skip successfully_built_dockerfile_action_propagates_nonzero_exit_code
              --skip subdirectory_dockerfile_uses_action_root_as_context
              --skip dockerfile_specific_ignore_overrides_root_ignore
              --skip context_symlink_escape_fails_before_action_container_starts
              --skip synthetic_secrets_stay_out_of_context_and_logs
              --skip changed_context_rebuilds_while_unchanged_context_hits_cache
              --skip cancelled_build_does_not_start_action_and_same_key_retries
              --skip timed_out_action_does_not_start_entrypoint_and_same_key_retries
          - name: engine
            suite-args: --test docker_test
          - name: job-config
            suite-args: --test job_docker_config_docker_test --test composite_test
          - name: lib
            suite-args: --lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry

      - name: Fetch crates for the offline container suite
        run: |
          cargo fetch --locked
          # Crate tarballs carry upstream file modes and some crates (fnv
          # 1.0.7) ship 0640 files; the in-container suite runs as uid 1000
          # while the cache belongs to the runner user, so make the
          # read-only registry bind readable for that uid.
          chmod -R a+rX ~/.cargo/registry/src

      - name: Restore the container cargo target cache
        uses: actions/cache@v4
        with:
          path: .tmp/ci-docker-target
          key: docker-target-v1-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('scripts/ci/docker-suite.sh') }}
          restore-keys: docker-target-v1-

      # Only container-mode suites (engine) download the node runtimes, but
      # every shard restores them; an ungated save would let an empty
      # shard-first finisher poison the entry under this exact key.
      - name: Restore the shared test externals cache
        uses: actions/cache/restore@v4
        with:
          path: .tmp/ci-test-externals
          key: test-externals-v2-${{ hashFiles('src/node.rs') }}
          restore-keys: test-externals-v2-

      # Pull the pinned images while the caches above restore; docker-suite.sh
      # re-checks them and the daemon dedupes concurrent digest pulls.
      - name: Start prefetching the suite images
        run: |
          grep -E '^(DIND_IMAGE|CLI_IMAGE|NODE_IMAGE|RUST_IMAGE|BUILDKIT_REFERENCE)=' scripts/ci/docker-suite.sh \
            | cut -d= -f2- | tr -d '"' | xargs -n1 -P5 docker pull > /tmp/chimera-image-prefetch.log 2>&1 &

      # ubuntu-24.04 restricts unprivileged user namespaces through AppArmor,
      # which kills the nested rootless daemon's rootlesskit with
      # "fork/exec /proc/self/exe: operation not permitted" even inside a
      # privileged container. The runner VM is ephemeral, so relaxing the
      # restriction is contained to this job.
      - name: Allow the nested rootless daemon to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the shard against a rootless daemon
        run: |
          export SUITE_ARGS="${{ matrix.suite-args }}"
          export TEST_FILTERS="${{ matrix.test-filters }}"
          export SHARD_NAME="${{ matrix.name }}"
          scripts/ci/docker-suite.sh

      # The engine suite always runs setup_docker, so its externals dir is the
      # populated one; saving from any other shard would archive an empty dir.
      - name: Save the shared test externals cache
        if: matrix.name == 'engine'
        uses: actions/cache/save@v4
        with:
          path: .tmp/ci-test-externals
          key: test-externals-v2-${{ hashFiles('src/node.rs') }}
